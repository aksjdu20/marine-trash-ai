# Existing best B weights -> new optimizer, 50 additional epochs. Original A/B stay unchanged.
model: models/B_seed42/weights/best.pt
data: data/processed/trashcan_instance_seed42/dataset.yaml
classes:
- Trash
- Marine_Life
- Equipment
device: auto
seed: 42
train:
  epochs: 50
  imgsz: 640
  batch: 8
  optimizer: AdamW
  lr0: 0.0001
  workers: 0
  patience: 0
  deterministic: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
underwater:
  strength: 0.5
  probability: 0.8
evaluation:
  conf: 0.25
  ap_conf: 0.001
  match_iou: 0.5
  nms_iou: 0.7
  max_det: 300
  max_error_images: 40
weights:
  A: models/A_seed42/weights/best.pt
  B: models/B_finetune_seed42/weights/best.pt
finetune:
  run_name: B_finetune_seed42
  reference_evaluation: results/evaluation/B_seed42
  source_run: models/B_seed42
  additional_labeled_camera_images: 0
